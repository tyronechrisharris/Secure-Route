name: Release Builds

on:
  release:
    types: [created]

jobs:
  test_and_build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            artifact_name: secure-route-linux
            asset_name: secure-route-linux-amd64
          - os: macos-latest
            artifact_name: secure-route-mac
            asset_name: secure-route-macos-amd64
          - os: windows-latest
            artifact_name: secure-route.exe
            asset_name: secure-route-windows-amd64.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install OS dependencies (Linux only)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y fonts-freefont-ttf python3

      - name: Run Tests (using small PBF extract)
        run: cargo test --release

      - name: Run Benchmarks
        run: cargo bench

      - name: Build release binary
        run: cargo build --release

      - name: Rename and Prepare Asset (Linux/Mac)
        if: matrix.os != 'windows-latest'
        run: mv target/release/secure-route ${{ matrix.asset_name }}

      - name: Rename and Prepare Asset (Windows)
        if: matrix.os == 'windows-latest'
        run: move target/release/secure-route.exe ${{ matrix.asset_name }}

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset_name }}
