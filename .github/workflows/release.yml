name: Release Builds

on:
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test_and_build:
    name: Build on ${{ matrix.asset_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Target 1: Linux
          - os: ubuntu-latest
            artifact_name: secure-route-linux
            asset_name: secure-route-linux-amd64
            rustflags: ''
          # Target 2: Generic Mac (M1/M2/M3 compatible)
          - os: macos-latest
            artifact_name: secure-route-mac
            asset_name: secure-route-macos-arm64
            rustflags: ''
          # Target 3: Optimized Mac M4 Max
          - os: macos-latest
            artifact_name: secure-route-mac-m4
            asset_name: secure-route-macos-m4-max
            rustflags: '-C target-cpu=apple-m4'
          # Target 4: Windows
          - os: windows-latest
            artifact_name: secure-route.exe
            asset_name: secure-route-windows-amd64.exe
            rustflags: ''

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install OS dependencies (Linux only)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y fonts-freefont-ttf python3

      - name: Run Tests (using small PBF extract)
        run: cargo test --release

      - name: Run Benchmarks
        run: cargo bench

      - name: Build release binary
        run: cargo build --release
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}

      - name: Rename and Prepare Asset (Linux/Mac)
        if: matrix.os != 'windows-latest'
        run: mv target/release/secure-route ${{ matrix.asset_name }}

      - name: Rename and Prepare Asset (Windows)
        if: matrix.os == 'windows-latest'
        run: move target/release/secure-route.exe ${{ matrix.asset_name }}

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset_name }}
          tag_name: ${{ github.event.release.tag_name || format('manual-{0}', github.run_id) }}
