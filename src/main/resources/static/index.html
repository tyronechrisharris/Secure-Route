<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Security Routing Dashboard</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/@geoman-io/leaflet-geoman-free@latest/dist/leaflet-geoman.css" />
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <style>
        body { margin: 0; padding: 0; display: flex; font-family: 'Segoe UI', sans-serif; height: 100vh; }
        #sidebar { width: 350px; background: #1a1a1a; color: #f0f0f0; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; box-shadow: 2px 0 5px rgba(0,0,0,0.5); z-index: 1000; }
        #map { flex-grow: 1; height: 100%; }
        .view-section { display: none; flex-direction: column; gap: 15px; }
        .view-section.active { display: flex; }
        .tab-container { display: flex; gap: 10px; margin-bottom: 10px; }
        .tab-btn { flex: 1; padding: 8px; background: #333; border: 1px solid #555; color: #ccc; cursor: pointer; border-radius: 3px; }
        .tab-btn.active { background: #4facfe; color: white; border-color: #4facfe; }
        h2 { margin-top: 0; color: #4facfe; }
        .control-group { background: #2c2c2c; padding: 15px; border-radius: 5px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="number"], select { width: 100%; padding: 8px; margin-bottom: 10px; background: #333; border: 1px solid #555; color: white; border-radius: 3px; box-sizing: border-box; }
        button { background: #4facfe; color: white; border: none; padding: 10px 15px; cursor: pointer; border-radius: 3px; font-weight: bold; width: 100%; }
        button:hover { background: #00f2fe; }
        .asset-toggle { display: flex; align-items: center; gap: 10px; margin-bottom: 5px; }
        #assessment { margin-top: 20px; background: #2c2c2c; padding: 15px; border-radius: 5px; display: none; }
        .metric { display: flex; justify-content: space-between; margin-bottom: 5px; border-bottom: 1px solid #444; padding-bottom: 5px; }
        .metric:last-child { border-bottom: none; }
        .metric-value { color: #00f2fe; font-weight: bold; }
        #drop-zone { border: 2px dashed #555; border-radius: 5px; padding: 20px; text-align: center; color: #888; cursor: pointer; margin-bottom: 10px; }
        #drop-zone.hover { border-color: #4facfe; background: #2c2c2c; color: #4facfe; }
        #log-console { background: #000; color: #0f0; padding: 10px; border-radius: 3px; font-family: monospace; height: 150px; overflow-y: auto; font-size: 11px; margin-top: 10px; white-space: pre-wrap; }
        .status-idle { color: #888; }
        .status-processing { color: #f39c12; }
        .status-success { color: #2ecc71; }
        .status-error { color: #e74c3c; }
        #waypoint-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 250px;
            background: rgba(26, 26, 26, 0.9);
            color: white;
            padding: 15px;
            border-radius: 8px;
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border: 1px solid #444;
        }
        #waypoint-panel h3 { margin-top: 0; font-size: 16px; color: #4facfe; border-bottom: 1px solid #333; padding-bottom: 10px; }
        #waypoint-list { list-style: none; padding: 0; margin: 10px 0; max-height: 300px; overflow-y: auto; }
        .waypoint-item {
            background: #333;
            margin-bottom: 5px;
            padding: 10px;
            border-radius: 4px;
            cursor: grab;
            display: flex;
            align-items: center;
            font-size: 13px;
            border: 1px solid #444;
        }
        .waypoint-item:active { cursor: grabbing; }
        .waypoint-item .handle { margin-right: 10px; color: #888; }
    </style>
</head>
<body>

<div id="sidebar">
    <h2>Security Routing</h2>

    <div class="tab-container">
        <button class="tab-btn active" onclick="switchView('routing')">Routing</button>
        <button class="tab-btn" onclick="switchView('data')">Data Management</button>
    </div>

    <div id="routing-view" class="view-section active">
        <div class="control-group">
            <label>Route Parameters</label>
            <label>Start (Lat, Lon)</label>
            <div style="display: flex; gap: 5px;">
                <input type="number" id="startLat" placeholder="Lat" step="0.0001" value="51.5074">
                <input type="number" id="startLon" placeholder="Lon" step="0.0001" value="-0.1278">
            </div>

            <label>End (Lat, Lon)</label>
            <div style="display: flex; gap: 5px;">
                <input type="number" id="endLat" placeholder="Lat" step="0.0001" value="51.5150">
                <input type="number" id="endLon" placeholder="Lon" step="0.0001" value="-0.1100">
            </div>

            <label>Threat Avoidance Level</label>
            <select id="threatLevel">
                <option value="LOW">Low (Standard)</option>
                <option value="MEDIUM">Medium (Caution)</option>
                <option value="HIGH">High (Max Security)</option>
            </select>

            <button onclick="calculateRoute()">Calculate Secure Route</button>
        </div>

        <div class="control-group">
            <label>Asset Visibility</label>
            <div class="asset-toggle"><input type="checkbox" id="togglePolice" checked onchange="toggleLayer('POLICE')"> Police</div>
            <div class="asset-toggle"><input type="checkbox" id="toggleEMS" checked onchange="toggleLayer('EMS')"> EMS / Hospital</div>
            <div class="asset-toggle"><input type="checkbox" id="toggleMilitary" checked onchange="toggleLayer('MILITARY')"> Military</div>
            <div class="asset-toggle"><input type="checkbox" id="toggleSafeHaven" checked onchange="toggleLayer('SAFE_HAVEN')"> Safe Havens</div>

            <button onclick="saveThreats()" style="margin-top: 10px; background: #e74c3c;">Save Threats</button>
        </div>
    </div>

    <div id="data-view" class="view-section">
        <div class="control-group">
            <label>Upload New .pbf</label>
            <div id="drop-zone" onclick="document.getElementById('file-input').click()">
                Drag & Drop or Click to Upload
                <input type="file" id="file-input" style="display: none" accept=".pbf,.osm,.bz2" onchange="handleFileUpload(this.files[0])">
            </div>
            <div id="upload-progress-bar" style="display: none; height: 5px; background: #4facfe; width: 0%; margin-bottom: 10px; transition: width 0.3s;"></div>
        </div>

        <div class="control-group">
            <label>Cache Selection</label>
            <select id="cache-select">
                <option value="">Select a cached file...</option>
            </select>
            <div style="display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px;">
                <button onclick="runTransform()" id="transform-btn" style="background: #e67e22; flex: 1;">Transform</button>
                <button onclick="applyToMap()" id="apply-btn" style="background: #2ecc71; flex: 1;">Apply to Map</button>
                <button onclick="zoomToMap()" id="zoom-btn" style="background: #3498db; flex: 1 1 100%;">Zoom to Map</button>
            </div>
        </div>

        <div class="control-group">
            <label>Status: <span id="status-indicator" class="status-idle">Idle</span></label>
            <div id="log-console"></div>
        </div>
    </div>

    <div id="assessment">
        <h3>Route Assessment</h3>
        <div class="metric"><span>Distance:</span> <span id="valDistance" class="metric-value">-</span></div>
        <div class="metric"><span>Est. Time:</span> <span id="valTime" class="metric-value">-</span></div>
        <div class="metric"><span>Choke Points Avoided:</span> <span id="valChoke" class="metric-value">-</span></div>
        <div class="metric"><span>Proximity to Support:</span> <span id="valProximity" class="metric-value">-</span></div>
        <div class="metric"><span>ETA to Safe Haven:</span> <span id="valSafeHaven" class="metric-value">-</span></div>
        <div class="metric">
            <span>Intersected Threats:</span>
            <span id="valThreats" class="metric-value" style="font-weight: bold;">-</span>
        </div>
    </div>
</div>

<div id="map"></div>

<div id="waypoint-panel">
    <h3>Route Waypoints</h3>
    <ul id="waypoint-list"></ul>
    <button onclick="calculateRoute()">Calculate Route</button>
</div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/@geoman-io/leaflet-geoman-free@latest/dist/leaflet-geoman.min.js"></script>
    <script src="https://unpkg.com/pmtiles@3.0.6/dist/index.js"></script>
    <script>
        // Fallback for PMTiles if it loads as a module but we need it globally
        if (typeof pmtiles === 'undefined') {
            window.pmtiles = { Protocol: function() { return { tile: function() {} }; } };
        }
    </script>
<script src="app.js"></script>
</body>
</html>
