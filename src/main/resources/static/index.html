<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Security Routing Dashboard</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/@geoman-io/leaflet-geoman-free@latest/dist/leaflet-geoman.css" />
    <style>
        body { margin: 0; padding: 0; display: flex; font-family: 'Segoe UI', sans-serif; height: 100vh; }
        #sidebar { width: 350px; background: #1a1a1a; color: #f0f0f0; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; box-shadow: 2px 0 5px rgba(0,0,0,0.5); z-index: 1000; }
        #map { flex-grow: 1; height: 100%; }
        h2 { margin-top: 0; color: #4facfe; }
        .control-group { background: #2c2c2c; padding: 15px; border-radius: 5px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="number"], select { width: 100%; padding: 8px; margin-bottom: 10px; background: #333; border: 1px solid #555; color: white; border-radius: 3px; box-sizing: border-box; }
        button { background: #4facfe; color: white; border: none; padding: 10px 15px; cursor: pointer; border-radius: 3px; font-weight: bold; width: 100%; }
        button:hover { background: #00f2fe; }
        .asset-toggle { display: flex; align-items: center; gap: 10px; margin-bottom: 5px; }
        #assessment { margin-top: 20px; background: #2c2c2c; padding: 15px; border-radius: 5px; display: none; }
        .metric { display: flex; justify-content: space-between; margin-bottom: 5px; border-bottom: 1px solid #444; padding-bottom: 5px; }
        .metric:last-child { border-bottom: none; }
        .metric-value { color: #00f2fe; font-weight: bold; }
    </style>
</head>
<body>

<div id="sidebar">
    <h2>Security Routing</h2>

    <div class="control-group">
        <label>Route Parameters</label>
        <label>Start (Lat, Lon)</label>
        <div style="display: flex; gap: 5px;">
            <input type="number" id="startLat" placeholder="Lat" step="0.0001" value="51.5074">
            <input type="number" id="startLon" placeholder="Lon" step="0.0001" value="-0.1278">
        </div>

        <label>End (Lat, Lon)</label>
        <div style="display: flex; gap: 5px;">
            <input type="number" id="endLat" placeholder="Lat" step="0.0001" value="51.5150">
            <input type="number" id="endLon" placeholder="Lon" step="0.0001" value="-0.1100">
        </div>

        <label>Threat Avoidance Level</label>
        <select id="threatLevel">
            <option value="LOW">Low (Standard)</option>
            <option value="MEDIUM">Medium (Caution)</option>
            <option value="HIGH">High (Max Security)</option>
        </select>

        <button onclick="calculateRoute()">Calculate Secure Route</button>
    </div>

    <div class="control-group">
        <label>Asset Visibility</label>
        <div class="asset-toggle"><input type="checkbox" id="togglePolice" checked onchange="toggleLayer('POLICE')"> Police</div>
        <div class="asset-toggle"><input type="checkbox" id="toggleEMS" checked onchange="toggleLayer('EMS')"> EMS / Hospital</div>
        <div class="asset-toggle"><input type="checkbox" id="toggleMilitary" checked onchange="toggleLayer('MILITARY')"> Military</div>
        <div class="asset-toggle"><input type="checkbox" id="toggleSafeHaven" checked onchange="toggleLayer('SAFE_HAVEN')"> Safe Havens</div>

        <button onclick="saveThreats()" style="margin-top: 10px; background: #e74c3c;">Save Threats</button>
    </div>

    <div id="assessment">
        <h3>Route Assessment</h3>
        <div class="metric"><span>Distance:</span> <span id="valDistance" class="metric-value">-</span></div>
        <div class="metric"><span>Est. Time:</span> <span id="valTime" class="metric-value">-</span></div>
        <div class="metric"><span>Choke Points Avoided:</span> <span id="valChoke" class="metric-value">-</span></div>
        <div class="metric"><span>Proximity to Support:</span> <span id="valProximity" class="metric-value">-</span></div>
        <div class="metric"><span>ETA to Safe Haven:</span> <span id="valSafeHaven" class="metric-value">-</span></div>
        <div class="metric">
            <span>Intersected Threats:</span>
            <span id="valThreats" class="metric-value" style="font-weight: bold;">-</span>
        </div>
    </div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/@geoman-io/leaflet-geoman-free@latest/dist/leaflet-geoman.min.js"></script>
<script src="app.js"></script>
</body>
</html>
