[package]
name = "secure-route"
version = "0.1.0"
edition = "2021"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "routing"
harness = false

[dependencies]
axum = "0.8.8"
bincode = "1.3"
clap = { version = "4.6.0", features = ["derive"] }
fast_paths = "1.0.0"
geo = "0.32.0"
mime_guess = "2.0.5"
osmpbfreader = "0.19.1"
rust-embed = { version = "8.11.0", features = ["mime-guess"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.50.0", features = ["full"] }
tower = "0.5.3"
tower-http = { version = "0.6.8", features = ["fs"] }
redb = "2.1"
pathfinding = "4.3.0"

# High-Performance Additions for M4 Max Architecture
mimalloc = "0.1"
rayon = "1.10"
memmap2 = "0.9"
